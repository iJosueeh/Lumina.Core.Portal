<div class="min-h-screen bg-gray-50">

  <!-- Sticky Header -->
  <header class="sticky top-0 z-30 bg-white border-b border-slate-200 shadow-sm">
    <div class="max-w-[1400px] mx-auto px-4 md:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center gap-4">
        <button (click)="goBack()" class="p-2 text-slate-400 hover:text-slate-600 hover:bg-slate-100 rounded-lg transition-all">
          <i class="fas fa-arrow-left"></i>
        </button>
        <div>
          <h1 class="text-lg font-bold text-slate-900">{{ isEditing() ? 'Editar Evento' : 'Crear Evento' }}</h1>
          <p class="text-xs text-slate-400">Vista previa en tiempo real</p>
        </div>
      </div>
      <div class="flex items-center gap-3">
        @if (saveSuccess()) {
          <span class="text-sm font-semibold text-violet-600 flex items-center gap-2">
            <i class="fas fa-check-circle"></i> Guardado
          </span>
        }
        <button (click)="save()"
          [disabled]="isSaving() || !titulo() || !fecha()"
          class="px-5 py-2.5 bg-violet-600 hover:bg-violet-500 disabled:bg-slate-300 disabled:cursor-not-allowed text-white font-bold text-sm rounded-xl shadow-lg shadow-violet-500/20 transition-all flex items-center gap-2">
          <i class="fas" [class.fa-save]="!isSaving()" [class.fa-spinner]="isSaving()" [class.fa-spin]="isSaving()"></i>
          {{ isSaving() ? 'Guardando...' : 'Guardar Cambios' }}
        </button>
      </div>
    </div>
  </header>

  <!-- Split View -->
  <div class="flex max-w-[1400px] mx-auto">
    
    <!-- Left: Form -->
    <div class="w-1/2 p-6 md:p-8 border-r border-slate-200 bg-white">
      <div class="max-w-xl mx-auto space-y-6">

        <div>
          <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Titulo *</label>
          <input type="text" [value]="titulo()" (input)="titulo.set($any($event.target).value)"
            placeholder="Titulo del evento"
            class="w-full bg-slate-50 border border-slate-200 rounded-xl py-3 px-4 text-sm text-slate-900 placeholder-slate-400 focus:outline-none focus:border-violet-500 focus:ring-2 focus:ring-violet-500/10 transition-all">
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Fecha *</label>
            <input type="date" [value]="fecha()" (input)="fecha.set($any($event.target).value)"
              class="w-full bg-slate-50 border border-slate-200 rounded-xl py-3 px-4 text-sm text-slate-900 focus:outline-none focus:border-violet-500 focus:ring-2 focus:ring-violet-500/10 transition-all">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Hora</label>
            <input type="time" [value]="hora()" (input)="hora.set($any($event.target).value)"
              class="w-full bg-slate-50 border border-slate-200 rounded-xl py-3 px-4 text-sm text-slate-900 focus:outline-none focus:border-violet-500 focus:ring-2 focus:ring-violet-500/10 transition-all">
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Tipo</label>
          <select [value]="tipo()" (change)="tipo.set($any($event.target).value)"
            class="w-full bg-slate-50 border border-slate-200 rounded-xl py-3 px-4 text-sm text-slate-700 focus:outline-none focus:border-violet-500 focus:ring-2 focus:ring-violet-500/10 transition-all cursor-pointer">
            @for (t of tipos; track t) { <option [value]="t">{{ t }}</option> }
          </select>
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Texto del Boton</label>
            <input type="text" [value]="botonTexto()" (input)="botonTexto.set($any($event.target).value)"
              placeholder="Registrarse"
              class="w-full bg-slate-50 border border-slate-200 rounded-xl py-3 px-4 text-sm text-slate-900 placeholder-slate-400 focus:outline-none focus:border-violet-500 focus:ring-2 focus:ring-violet-500/10 transition-all">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Estilo del Boton</label>
            <select [value]="botonTipo()" (change)="botonTipo.set($any($event.target).value)"
              class="w-full bg-slate-50 border border-slate-200 rounded-xl py-3 px-4 text-sm text-slate-700 focus:outline-none focus:border-violet-500 focus:ring-2 focus:ring-violet-500/10 transition-all cursor-pointer">
              @for (bt of botonTipos; track bt.value) { <option [value]="bt.value">{{ bt.label }}</option> }
            </select>
          </div>
        </div>

        <div class="flex items-center gap-3">
          <input type="checkbox" [checked]="esProximo()" (change)="esProximo.set($any($event.target).checked)"
            class="w-5 h-5 rounded-lg border-slate-300 text-violet-600 focus:ring-violet-500 cursor-pointer">
          <label class="text-sm font-semibold text-slate-700 cursor-pointer">Evento proximo</label>
        </div>
      </div>
    </div>

    <!-- Right: Preview -->
    <div class="w-1/2 p-6 md:p-8 bg-slate-50">
      <div class="max-w-xl mx-auto">
        <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-6 flex items-center gap-2">
          <i class="fas fa-eye"></i> Vista Previa
        </h2>

        <!-- Preview Card -->
        <div class="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-sm">
          <div class="bg-gradient-to-r from-violet-600 to-indigo-600 p-8 text-white">
            <div class="flex items-center justify-between">
              <div>
                <p class="text-sm font-bold opacity-70 uppercase tracking-wider">{{ getPreviewMes() }}</p>
                <p class="text-6xl font-black mt-1">{{ getPreviewDia() }}</p>
              </div>
              <div class="text-right">
                <span class="text-sm font-bold px-4 py-1.5 rounded-lg"
                  [class]="tipo() === 'Online' ? 'bg-white/20' : 'bg-white/10'">
                  {{ tipo() }}
                </span>
                <p class="text-lg mt-3 opacity-80">{{ hora() || '00:00' }}</p>
              </div>
            </div>
          </div>

          <div class="p-8">
            <h3 class="text-2xl font-black text-slate-900 mb-3">
              {{ titulo() || 'Titulo del evento' }}
            </h3>
            <p class="text-slate-400 mb-6">{{ getPreviewDate() }}</p>

            <button class="px-6 py-3 rounded-xl font-bold text-sm text-white transition-all"
              [class]="botonTipo() === 'primary' ? 'bg-violet-600 hover:bg-violet-500 shadow-lg shadow-violet-500/20' : 'bg-slate-200 text-slate-700 hover:bg-slate-300'">
              {{ botonTexto() || 'Accion' }}
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
