<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3.5 sm:gap-4 md:gap-6">
    @if (isLoading) {
        @for (i of [1,2,3,4]; track i) {
            <div class="h-32 sm:h-36 bg-white rounded-xl border border-slate-200 p-5 flex flex-col justify-between shadow-xs animate-pulse">
                <div class="h-3.5 w-20 bg-slate-100 rounded-full"></div>
                <div class="h-8 w-16 bg-slate-100 rounded-lg mt-4"></div>
            </div>
        }
    } @else {
        <app-stat-card 
            label="Cursos Activos" 
            [value]="coursesCount.toString()" 
            icon="book" 
            description="En este periodo"
            color="blue">
        </app-stat-card>

        <app-stat-card 
            label="Tareas Pendientes" 
            [value]="pendingAssignments.toString()" 
            icon="clock" 
            description="Entregas próximas"
            color="orange"
            [trend]="pendingAssignments > 0 ? 'Revisar' : 'Al día'"
            [trendType]="pendingAssignments > 0 ? 'negative' : 'positive'">
        </app-stat-card>

        <app-stat-card
            label="Promedio General"
            [value]="promedioGeneral.toFixed(1)"
            icon="star"
            description="Rendimiento actual"
            color="teal"
            [trend]="trendAverage"
            [trendType]="trendAverage.startsWith('+') ? 'positive' : 'neutral'">
        </app-stat-card>

        <app-stat-card
            label="Asistencia Total"
            [value]="asistenciaTotal + '%'"
            icon="calendar-check"
            description="Registro histórico"
            color="purple">
        </app-stat-card>
    }
</div>
