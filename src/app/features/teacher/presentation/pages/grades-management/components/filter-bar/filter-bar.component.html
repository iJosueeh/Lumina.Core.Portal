<div class="flex flex-col md:flex-row items-stretch md:items-center justify-between gap-4 sm:gap-6">
    <!-- Selectores y Búsqueda -->
    <div class="flex flex-col sm:flex-row items-stretch sm:items-end gap-3.5 sm:gap-5 w-full md:w-auto">

        <!-- Selector de Curso -->
        <div class="w-full sm:w-72">
            <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1.5 sm:mb-2 ml-1">Asignatura</label>
            <div class="relative">
                <div class="absolute inset-y-0 left-4 flex items-center pointer-events-none">
                    <i class="fas fa-book-open text-slate-400 text-xs"></i>
                </div>
                <select
                    [ngModel]="selectedCourseId"
                    (ngModelChange)="courseChange.emit($event)"
                    class="w-full bg-slate-50 border border-slate-200 rounded-xl py-2.5 sm:py-3 pl-10 pr-10 text-slate-900 appearance-none focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all text-xs sm:text-sm cursor-pointer min-h-[42px]">
                    @for (course of courses; track course.id) {
                        <option [value]="course.id">{{ course.titulo }} ({{ course.codigo }})</option>
                    }
                </select>
                <div class="absolute inset-y-0 right-4 flex items-center pointer-events-none">
                    <i class="fas fa-chevron-down text-[10px] text-slate-400"></i>
                </div>
            </div>
        </div>

        <!-- Buscador -->
        <div class="w-full sm:w-64">
            <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1.5 sm:mb-2 ml-1">Filtrar Estudiante</label>
            <div class="relative">
                <div class="absolute inset-y-0 left-4 flex items-center pointer-events-none">
                    <i class="fas fa-search text-slate-400 text-xs"></i>
                </div>
                <input
                    type="text"
                    [ngModel]="searchTerm"
                    (ngModelChange)="searchChange.emit($event)"
                    placeholder="Nombre o código..."
                    class="w-full bg-slate-50 border border-slate-200 rounded-xl py-2.5 sm:py-3 pl-10 pr-4 text-slate-900 placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all text-xs sm:text-sm min-h-[42px]">
            </div>
        </div>
    </div>

    <!-- Acciones Rápidas -->
    <div class="flex items-center gap-3 w-full md:w-auto self-stretch md:self-end">
        <button (click)="export.emit()"
            class="w-full sm:w-auto justify-center px-4 sm:px-5 py-2.5 sm:py-3 bg-white border border-slate-200 hover:bg-slate-50 text-slate-700 font-semibold rounded-xl transition-all flex items-center gap-2 shadow-sm text-xs sm:text-sm min-h-[42px] cursor-pointer">
            <i class="fas fa-file-export text-indigo-500 text-xs"></i>
            <span>Exportar CSV</span>
        </button>
    </div>
</div>
